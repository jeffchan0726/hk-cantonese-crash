<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>速成練習 · 香港速成輸入法</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css?v=15">
  <link rel="stylesheet" href="css/ime.css?v=15">
</head>
<body>
  <aside class="sidenav" id="sidenav">
    <div class="brand">
      <div class="logo">速</div>
      <div>
        <div class="brand-title">速成練習</div>
        <div class="brand-sub">香港速成輸入法</div>
      </div>
    </div>
    <nav class="side-tabs" id="side-tabs"></nav>
    <p class="side-hint">打頭尾兩碼，游標旁出 1–9 候選窗，好似 Windows 速成。</p>
  </aside>
  <div class="stage">
    <header class="topbar">
      <div class="top-left">
        <span class="device-pill" id="device-pill">—</span>
        <span class="goal-pill" id="goal-pill">今日 0/20</span>
      </div>
    </header>
    <main id="main" class="main">載入中…</main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="toast" class="toast" hidden></div>
  <script>
    window.onerror = function (m) {
      var el = document.getElementById("main");
      if (el) el.innerHTML = "<pre class='boot-err'>" + String(m) + "</pre>";
    };
  </script>
  <script src="js/data.js?v=15"></script>
  <script src="js/slang.js?v=15"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=15").catch(function () {});
    }
  </script>
</body>
</html>

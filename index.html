<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>速成練習 — 香港速成輸入法</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand" id="brand-btn" style="cursor:pointer;display:flex;gap:10px;align-items:center">
        <div class="logo">速</div>
        <div><h1>速成練習</h1><p>香港速成輸入法</p></div>
      </div>
    </header>
    <section id="view-home" class="view">
      <div class="hero">
        <div class="k">SUCHENG / QUICK</div>
        <h2>只打頭碼同尾碼<br>就打到繁體中文。</h2>
        <p class="tiny">速成 = 倉頡簡化版。記住 24 個字根，再練拆頭尾。</p>
        <div class="stats">
          <div class="stat"><b id="stat-streak">0</b><span>連續日</span></div>
          <div class="stat"><b id="stat-ok">0</b><span>拆啲</span></div>
          <div class="stat"><b id="stat-acc">0%</b><span>準確率</span></div>
        </div>
      </div>
      <div class="tasks">
        <button class="task" id="go-roots"><div><b>① 記字根</b><span>24 鍵：日金木水火土…</span></div><em>去</em></button>
        <button class="task" id="go-drill"><div><b>② 拆頭尾</b><span>睇字，打兩個英文字母</span></div><em>去</em></button>
        <button class="task" id="go-type"><div><b>③ 網頁打字</b><span>入碼擇字，練選字手勢</span></div><em>去</em></button>
        <button class="task" id="go-hard"><div><b>難字關</b><span>長碼／難拆字</span></div><em>去</em></button>
      </div>
    </section>
    <section id="view-roots" class="view hidden">
      <h3>倉頡／速成字根</h3>
      <p class="tiny" id="root-hint"></p>
      <div class="root-grid" id="root-grid"></div>
    </section>
    <section id="view-drill" class="view hidden">
      <div class="drill-card">
        <div class="tiny" id="drill-meta"></div>
        <div class="big" id="drill-char">港</div>
        <form id="drill-form">
          <input class="box" id="drill-input" maxlength="2" autocapitalize="off" autocomplete="off" placeholder="輸入頭尾碼，例如 EU" />
          <div class="row">
            <button class="btn primary" type="submit">核對</button>
            <button class="btn" type="button" id="drill-show">睇答案</button>
            <button class="btn ghost" type="button" id="drill-next">下一字</button>
          </div>
        </form>
        <div id="drill-ans" style="margin-top:12px"></div>
      </div>
      <p class="tiny" style="margin-top:12px">規則：上→下、左→右、外→內。只取倉頡<strong>第一碼 + 最後一碼</strong>。</p>
    </section>
    <section id="view-type" class="view hidden">
      <div class="out" id="out"></div>
      <div class="tiny" id="code-now" style="margin:8px 0">未入碼</div>
      <div class="cands" id="cands"></div>
      <div class="kb" id="kb"></div>
      <div class="row">
        <button class="btn" id="type-bs">刪</button>
        <button class="btn" id="type-space">翻頁／清碼</button>
        <button class="btn" id="copy-out">複製</button>
        <button class="btn ghost" id="type-clear">清空</button>
      </div>
      <p class="tiny">電腦鍵盤都可以打。數字鍵 1–9 擇候選字。</p>
    </section>
    <section id="view-lookup" class="view hidden">
      <input class="search" id="q" placeholder="查漢字或速成碼，例如 香 或 HA" />
      <div id="look-res"></div>
    </section>
    <section id="view-me" class="view hidden">
      <h3>進度</h3>
      <div class="stats">
        <div class="stat"><b id="me-streak">0</b><span>連續</span></div>
        <div class="stat"><b id="me-ok">0</b><span>拆啲</span></div>
        <div class="stat"><b id="me-acc">0%</b><span>準確率</span></div>
      </div>
      <p class="tiny" style="margin-top:12px">已用網頁打字：<span id="me-type">0</span> 字</p>
      <p class="tiny">碼表以倉頡五代（香港用字優先）轉速成頭尾碼。個別系統三代／五代可能有差異。</p>
      <button class="btn ghost" id="reset" style="margin-top:12px">清除進度</button>
    </section>
    <nav class="tabbar">
      <button class="tab on" data-view="home"><b>🏠</b>今日</button>
      <button class="tab" data-view="roots"><b>🔠</b>字根</button>
      <button class="tab" data-view="drill"><b>🧩</b>拆碼</button>
      <button class="tab" data-view="type"><b>⌨️</b>打字</button>
      <button class="tab" data-view="lookup"><b>🔎</b>查碼</button>
    </nav>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
